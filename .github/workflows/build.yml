name: Build Linux distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      web: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!screenshots/**'
              - '!README.md'
              - '!ARCHITECTURE.md'
            web:
              - 'web/**'
            workflow:
              - '.github/workflows/**'
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web && npm --prefix web run check
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Check formatting and lint Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: |
          cargo test --locked
          cargo test --locked --features dev-ui --test library_ui isolated_preview_workflow
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package binary, RPM and DEB
        run: |
          artifact=nfpm_2.49.0_Linux_x86_64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$artifact" "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/$artifact"
          (cd "$RUNNER_TEMP" && echo "2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7  $artifact" | sha256sum -c - && tar xzf "$artifact" nfpm)
          PATH="$RUNNER_TEMP:$PATH" packaging/build.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Install RPM in Fedora 44 and check boot enablement
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:44 sh -ec '
            dnf install -y /dist/*.rpm
            /usr/bin/lum --help
            systemctl is-enabled lum.service
            test -f /etc/lum/lum.env
            test "$(stat -c %U:%G:%a /opt/lum/runtimes)" = lum-svc:lum-svc:700
            # Exercise the same unit-free path offered by the manual tarball.
            LUM_DEVICE=task XDG_DATA_HOME=/tmp/lum-ci /usr/bin/lum run >/tmp/lum.log 2>&1 & pid=$!
            for i in $(seq 1 180); do grep -q "Lum library:" /tmp/lum.log && break; sleep 1; done
            grep -q "Lum library:" /tmp/lum.log || { cat /tmp/lum.log; exit 1; }
            kill -TERM "$pid"; wait "$pid"
            test -x /tmp/lum-ci/lum/runtimes/0.3.0/bin/loom-serve
            dnf remove -y lum
            test ! -e /etc/systemd/system/multi-user.target.wants/lum.service
          '
      - name: Exercise native lifecycle and installed DEB on CPU
        run: |
          sudo apt-get update -qq
          # No preinstalled Loom and no uv on the service's PATH are required.
          test ! -e /opt/lum/runtime
          # A CPU-only runner needs neither GPU group membership nor an AMD device.
          sudo mkdir -p /etc/systemd/system/lum.service.d
          printf '[Service]\nSupplementaryGroups=\nEnvironmentFile=\nEnvironment=LUM_DEVICE=task\nNoExecPaths=/var/lib/lum\n' | sudo tee /etc/systemd/system/lum.service.d/ci.conf
          sudo apt-get install -y ./dist/*.deb
          systemctl is-enabled lum.service
          systemd-analyze verify lum.service
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:9390/admin/runtime | jq -e '.setup.phase == "ready"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9390/admin/runtime | jq -e '.setup.phase == "ready"' || { sudo journalctl -u lum --no-pager; exit 1; }
          curl -fsS http://127.0.0.1:9390/assets/chat.js -o /dev/null
          curl -fsS http://127.0.0.1:9390/admin/state | jq -e '.online == true'
          sudo curl --fail --unix-socket /run/lum/engine.sock http://localhost/readyz
          pid=$(systemctl show -p MainPID --value lum.service)
          sudo nsenter -t "$pid" -m -- findmnt -T /var/lib/lum -n -o OPTIONS | tr ',' '\n' | grep -Fx noexec
          sudo test -f /var/lib/lum/library.sqlite
          sudo test ! -e /var/lib/lum/runtimes
          sudo test -x /opt/lum/runtimes/0.3.0/bin/loom-serve
          # Restart must reuse the verified SDK without reinstalling.
          installed=$(sudo stat -c '%i:%y' /opt/lum/runtimes/0.3.0/installed.lock)
          sudo systemctl restart lum.service
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9390/admin/runtime | jq -e '.setup.phase == "ready"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9390/admin/runtime | jq -e '.setup.phase == "ready"'
          sudo curl --fail --unix-socket /run/lum/engine.sock http://localhost/readyz
          test "$installed" = "$(sudo stat -c '%i:%y' /opt/lum/runtimes/0.3.0/installed.lock)"
          # Fixture tests run unprivileged with an independent SDK, not the service's private state.
          /usr/bin/python3 -m venv "$RUNNER_TEMP/fixtures"
          "$RUNNER_TEMP/fixtures/bin/python" -m pip install --require-hashes --only-binary=:all: -r runtimes/hrx-loom-0.3.0.lock
          PATH="$RUNNER_TEMP/fixtures/bin:$PATH" cargo test --locked -- --ignored
          sudo apt-get purge -y lum
          test ! -e /run/lum/engine.sock
      - uses: actions/upload-artifact@v7
        with:
          name: lum-linux-x86_64
          path: dist/
          if-no-files-found: error

  browser:
    needs: changes
    if: needs.changes.outputs.app == 'true' && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: rustup default stable
      - run: npm ci --prefix web && npm ci --prefix e2e
      - working-directory: e2e
        run: npm run format:check && npx --no-install playwright install --with-deps chromium && npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: e2e/test-results
  ci-result:
    if: always()
    needs: [changes, web, build, browser]
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      - run: echo 'Selected checks passed.'

  release:
    name: Publish GitHub Release
    needs: [web, build, browser]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match release tag to package version
        run: |
          version=$(cargo metadata --no-deps --locked --format-version=1 | jq -er '.packages[] | select(.name == "lum") | .version')
          # Cargo already validated SemVer. Release tags omit build metadata.
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" != *+* ]] || { echo 'Tag must match the Cargo version (without build metadata).' >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: lum-linux-x86_64
          path: dist
      - name: Verify tested assets
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header --output release-notes.md
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          options=(--latest=false)
          if [[ "$tag" == *-* ]]; then
            options+=(--prerelease)
          elif [[ "$tag" == "$(git tag --sort=-version:refname | grep -Ex 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' | sed -n '1p')" ]]; then
            options=(--latest=true)
          fi
          gh release create "$tag" --verify-tag --title "Lum $tag" --notes-file release-notes.md \
            "${options[@]}" dist/*.rpm dist/*.deb dist/*.tar.gz dist/SHA256SUMS
