name: Rust dependency advisories
on:
  pull_request:
    paths: [Cargo.lock, .github/workflows/rust-advisories.yml]
  push:
    branches: [main]
    paths: [Cargo.lock, .github/workflows/rust-advisories.yml]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cargo install --locked --version 0.23.0 cargo-audit
      - run: cargo audit
